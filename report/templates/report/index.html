{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class="row mt-3">
        <div class="col mx-auto mb-3">
            <h2>Report a Review</h2>
            <hr />
            <form method="POST">
                {% csrf_token %}
                <p>
                    <label for="comment">Why is this review being reported?</label>
                    <textarea name="comment" required class="form-control" id="comment">
                        {{ template_data.report.comment }}
                    </textarea>
                </p>
                <div class="text-start">
                    <button type="submit"
                            class="btn bg-dark text-white">Submit Report</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
